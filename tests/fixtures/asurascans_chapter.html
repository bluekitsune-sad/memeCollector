<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Regressor and the Blind Saint - Chapter 20 - Asura Scans</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <a href="/"><img src="https://asurascans.com/assets/logo.png" alt="AsuraScans" width="180" height="48"></a>
    <nav class="main-nav">
      <a href="/popular"><img src="https://asurascans.com/assets/nav-icon.png" alt="" width="24" height="24"></a>
      <a href="/search"><img src="https://asurascans.com/assets/search.png" alt="" width="24" height="24"></a>
    </nav>
  </header>

  <main class="reader">
    <div class="reader-pages">
      <img src="https://asurascans.com/uploads/comics/regressor/ch20/panel-1.png" alt="page 1">
      <img src="https://asurascans.com/uploads/comics/regressor/ch20/panel-2.png" alt="page 2">
    </div>

    <aside class="sidebar">
      <img src="https://asurascans.com/assets/sidebar-trending.png" alt="trending" width="300" height="400">
      <img src="https://asurascans.com/assets/related-1.png" alt="related" width="120" height="160">
    </aside>

    <section class="series-reviews">
      <div id="review-9001" class="py-4 scroll-mt-20 relative">
        <p class="mt-2 text-xs text-zinc-500">Reader review</p>
        <div class="text-sm text-zinc-300 leading-relaxed break-words">
          Review body that must never be scanned as a comment.
        </div>
        <div class="mt-3 flex gap-2">
          <div class="relative inline-block group/media">
            <img src="https://asurascans.com/uploads/reviews/review-attach.png" alt="Comment media" loading="lazy">
          </div>
        </div>
      </div>
    </section>

    <div id="comments-section">
      <div id="comment-composer" class="composer">
        <a href="/user/me" class="block relative group">
          <div class="rounded-full overflow-hidden w-10 h-10">
            <img src="https://asurascans.com/avatars/me.png" alt="me" class="w-10 h-10 rounded-full object-cover">
          </div>
        </a>
        <textarea placeholder="Write a comment..."></textarea>
        <div class="composer-actions"><img src="https://asurascans.com/assets/attach-icon.png" alt=""></div>
      </div>

      <div id="comment-5001" class="py-4 scroll-mt-20 relative">
        <div class="flex">
          <div class="flex-shrink-0 mr-3">
            <a href="/user/alice" class="block relative group">
              <div class="rounded-full overflow-hidden w-10 h-10">
                <img src="https://asurascans.com/avatars/alice.png" alt="alice" class="w-10 h-10 rounded-full object-cover" loading="lazy">
              </div>
            </a>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center flex-wrap gap-2 mb-1">
              <a href="/user/alice" class="font-semibold text-sm text-white hover:text-[#913FE2]">alice</a>
              <span class="text-xs text-zinc-500">2 hours ago</span>
            </div>
            <div class="text-sm text-zinc-300 leading-relaxed break-words">This chapter is fire, look at this</div>
            <div class="mt-3 flex gap-2">
              <div class="relative inline-block group/media">
                <img src="https://cdn.asurascans.com/media/hype-cat.png" alt="Comment media" loading="lazy" class="rounded-md max-h-48 object-contain border border-zinc-700">
              </div>
              <div class="relative inline-block group/media">
                <img src="/media/rel-sticker.gif" alt="Comment media" loading="lazy" class="rounded-md max-h-48 object-contain border border-zinc-700">
              </div>
            </div>
          </div>
        </div>

        <div id="comment-5002" class="py-4 scroll-mt-20 relative">
          <div class="flex">
            <div class="flex-shrink-0 mr-3">
              <a href="/user/bob" class="block relative group">
                <div class="rounded-full overflow-hidden w-10 h-10">
                  <img src="https://asurascans.com/avatars/bob.png" alt="bob" class="w-10 h-10 rounded-full object-cover" loading="lazy">
                </div>
              </a>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center flex-wrap gap-2 mb-1">
                <a href="/user/bob" class="font-semibold text-sm text-white hover:text-[#913FE2]">bob</a>
                <span class="text-xs text-zinc-500">1 hour ago</span>
              </div>
              <div class="text-sm text-zinc-300 leading-relaxed break-words">replying with my own sticker</div>
              <div class="mt-3 flex gap-2">
                <div class="relative inline-block group/media">
                  <img src="https://cdn.asurascans.com/media/reply-sticker.png" alt="Comment media" loading="lazy" class="rounded-md max-h-48 object-contain border border-zinc-700">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="comment-5003" class="py-4 scroll-mt-20 relative">
        <div class="flex">
          <div class="flex-shrink-0 mr-3">
            <a href="/user/carol" class="block relative group">
              <div class="rounded-full overflow-hidden w-10 h-10">
                <img src="https://asurascans.com/avatars/carol.png" alt="carol" class="w-10 h-10 rounded-full object-cover" loading="lazy">
              </div>
            </a>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center flex-wrap gap-2 mb-1">
              <a href="/user/carol" class="font-semibold text-sm text-white hover:text-[#913FE2]">carol</a>
              <span class="text-xs text-zinc-500">30 minutes ago</span>
            </div>
            <div class="text-sm text-zinc-300 leading-relaxed break-words">no image from me, just hype</div>
          </div>
        </div>
      </div>
    </div>

    <div class="ad-slot"><img src="https://ads.example-network.com/banner/asura-728x90.png" alt="advertisement"></div>
  </main>

  <footer class="site-footer">
    <img src="https://asurascans.com/assets/footer-ad.png" alt="footer promo">
  </footer>
</body>
</html>
