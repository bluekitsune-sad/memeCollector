server:
  host: 127.0.0.1
  port: 8000
storage:
  media_directory: ./data/media
  thumbnail_directory: ./data/thumbnails
  preview_directory: ./data/previews
  database_path: ./data/database.sqlite
crawler:
  delay_seconds: 1.0
  concurrency: 2
  max_pages: 1000
  download_limit: 5000
  max_file_size_mb: 100
  headless: true
  debug: false
  retry_attempts: 3
  request_timeout_seconds: 30.0
ai:
  provider: openrouter
  model: dots-studio/dots-3-note-preview:free
  embedding_model: nvidia/nemotron-3-embed-1b:free
  ai_concurrency: 2
  timeout_seconds: 60.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  mock_embedding_dim: 384
  max_item_attempts: 6
  retry_interval_seconds: 15.0
  retry_interval_max_seconds: 600.0
  supervisor_poll_seconds: 5.0
  revive_after_seconds: 1800.0
  max_item_revives: 3
search:
  keyword_weight: 0.25
  semantic_weight: 0.5
  tag_weight: 0.2
  metadata_weight: 0.05
watch:
  enabled: true
  interval_minutes: 60.0
  max_pages_per_run: 20
backfill:
  # Site-wide catalog crawl (one comic at a time) started from the Jobs tab.
  # enabled=false blocks new backfills and the startup resume of an interrupted one.
  enabled: true
  # Pause between comics, on top of each crawl's own crawler.delay_seconds.
  delay_seconds: 2.0
